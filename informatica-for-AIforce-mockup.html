<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informatica for AIforce · in Claude</title>
<style>
:root{
  --page:#f1f3f6; --surface:#ffffff; --surface2:#f6f7f9; --ink:#17212c; --ink2:#44505e; --muted:#6c7888; --line:#e1e5ea;
  --brand:#0b6bcb; --brand-ink:#0a3f73; --brand-soft:#e8f2fc; --brand-line:#bcd8f3;
  --ok:#1f7a3f; --ok-soft:#e6f4eb; --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b42318; --bad-soft:#fdeceb;
  --bubble:#eceff3; --shadow:0 1px 2px rgba(23,33,44,.05),0 10px 30px rgba(23,33,44,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f141a; --surface:#171d25; --surface2:#1d2530; --ink:#e9edf2; --ink2:#c3ccd6; --muted:#8f9bab; --line:#2a3440;
    --brand:#5aa8f0; --brand-ink:#d3e7fb; --brand-soft:#16304c; --brand-line:#2d5680;
    --ok:#62c98a; --ok-soft:#14301f; --warn:#f0b25c; --warn-soft:#3a2a12; --bad:#f28b82; --bad-soft:#3a1a18;
    --bubble:#252e3a; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --page:#0f141a; --surface:#171d25; --surface2:#1d2530; --ink:#e9edf2; --ink2:#c3ccd6; --muted:#8f9bab; --line:#2a3440;
  --brand:#5aa8f0; --brand-ink:#d3e7fb; --brand-soft:#16304c; --brand-line:#2d5680;
  --ok:#62c98a; --ok-soft:#14301f; --warn:#f0b25c; --warn-soft:#3a2a12; --bad:#f28b82; --bad-soft:#3a1a18;
  --bubble:#252e3a; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
.shell{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:16px}
.top .actions{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:focus-visible,.scene:focus-visible,tr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px}
#scenes{display:flex;flex-direction:column;gap:4px}
.scene{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px}
.scene:hover{background:var(--surface2)}
.scene .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);flex:none}
.scene b{font-size:14px;display:block}
.scene span.p{font-size:12px;color:var(--muted)}
.scene[aria-current="step"]{background:var(--brand-soft)}
.scene[aria-current="step"] .n{background:var(--brand);color:#fff;border-color:var(--brand)}
.scene.done .n{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.center{display:flex;min-height:0;padding:16px;justify-content:center}
.host{width:100%;max-width:920px;display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.host-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.on{color:var(--ok)} .conn.on i{background:var(--ok)}
.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:760px;align-self:flex-start;width:100%;animation:rise .25s ease}
.msg.user{align-self:flex-end;width:auto;max-width:560px;background:var(--bubble);border-radius:14px;padding:10px 14px}
.msg p{margin:4px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tool{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 9px;margin:0 6px 4px 0}
.tool b{color:var(--brand);font-weight:600}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.composer .box{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.composer .box.empty{color:var(--muted)}
/* Informatica MCP App */
.app{margin-top:10px;border:1px solid var(--brand-line);border-radius:14px;overflow:hidden;background:var(--surface)}
.app-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:14px}
.app-head .logo{width:20px;height:20px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}
.app-head .r{margin-left:auto;font-weight:500;font-size:12.5px}
.app-body{padding:14px}
.app-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface2)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.meter{margin-left:auto;font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.ok-text{color:var(--ok);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)} tr.sel td{background:var(--brand-soft)}
.masked{color:var(--muted)}
.lineage{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.lineage span{border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:var(--surface2)}
.cand{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cand .who{flex:1}
.cand .who b{display:block}
.score{font-weight:700;width:48px;text-align:right}
.hi{color:var(--ok)} .mid{color:var(--warn)} .lo{color:var(--bad)}
.cand.flag{background:var(--warn-soft);margin:0 -14px;padding:10px 14px}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.why span{font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--brand-soft);color:var(--brand-ink)}
.block{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);border-radius:10px;padding:12px;color:var(--ink)}
.filters{display:flex;gap:6px;margin-bottom:8px}
.f{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px}
.f[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (max-width:760px){
  .shell{display:block;height:auto}
  .nav{border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  #scenes{flex-direction:row}
  .scene{min-width:150px}
  .center{height:82vh;padding:10px}
}
.srcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.srcgrid div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.srcgrid b{display:block;font-size:14px}
.srcgrid span{font-size:12px;color:var(--ok)}
.srcgrid .rs span{color:var(--warn)}
@media (max-width:760px){.srcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Informatica for AIforce · in Claude</h1>
    <div class="actions"><button class="btn" id="restart">Restart</button><button class="btn primary" id="next">Next →</button></div>
  </header>
  <nav class="nav" aria-label="Scenes"><div id="scenes"></div></nav>
  <main class="center">
    <section class="host" aria-label="Conversation in Claude">
      <div class="host-head"><b>Claude</b><span class="conn" id="conn"><i></i><span id="connText">Informatica · not connected</span></span></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="composer"><div class="box empty" id="box">Press Next to start</div><button class="btn primary" id="send">Send</button></div>
    </section>
  </main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},h="")=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else e.setAttribute(k,v);}if(h)e.innerHTML=h;return e;};
const chat=$("#chat"), box=$("#box");
function card(title,right,body,foot){
  const c=el("div",{class:"app"});
  c.appendChild(el("div",{class:"app-head"},`<span class="logo">i</span>Informatica · ${title}${right?`<span class="r">${right}</span>`:""}`));
  const b=el("div",{class:"app-body"}); if(typeof body==="string") b.innerHTML=body; else b.appendChild(body); c.appendChild(b);
  if(foot) c.appendChild(el("div",{class:"app-foot"},foot)); return c;
}
function on(c,sel,fn){ const x=c.querySelector(sel); if(x) x.addEventListener("click",fn); }

function cConnect(){
  const c=card("Connect","",`<div class="row" data-slot><button class="btn primary" data-sso>Sign in with company SSO</button><span class="muted">Once. Credentials stay with Informatica.</span></div>`,
    `<span class="chip brand">1 connection</span><span class="chip">300+ sources</span><span class="chip">Credentials held by Informatica</span>`);
  on(c,"[data-sso]",()=>{
    const srcs=[["SAP S/4HANA","Connected · CDC"],["Salesforce","Connected · real time"],["Snowflake","Connected · batch"],["Oracle EBS","Connected · batch"],["Databricks","Connected · batch"],["Mainframe Db2","Connected · CDC"],["Amazon S3","Connected · files"],["Workday","Restricted for your role"]];
    c.querySelector("[data-slot]").innerHTML=`<span class="ok-text">✓ Connected · Sales Operations</span>`;
    const g=el("div",{class:"srcgrid"},srcs.map(([n,m])=>`<div class="${m.startsWith("Restricted")?"rs":""}"><b>${n}</b><span>${m}</span></div>`).join(""));
    c.querySelector(".app-body").appendChild(g); setConn(true); });
  return c;
}
function cAsk(){
  const rows=[["Acme Industrial","$2.4M"],["Northwind Logistics","$1.7M"],["Globex Retail","$1.1M"]];
  const body=el("div");
  const t=el("table"); t.innerHTML=`<thead><tr><th>Account</th><th>Open orders · SAP</th><th>Opportunities · Salesforce</th><th>Owner email</th></tr></thead>`;
  const tb=el("tbody"); const lin=el("div",{class:"lineage"}); lin.hidden=true;
  rows.forEach(r=>{ const tr=el("tr",{class:"click",tabindex:"0"},`<td><b>${r[0]}</b></td><td>${r[1]}</td><td>None</td><td class="masked">•••• masked</td>`);
    const show=()=>{tb.querySelectorAll("tr").forEach(x=>x.classList.remove("sel"));tr.classList.add("sel");lin.innerHTML=`<b>Lineage</b><span>SAP · orders</span>→<span>Matched account</span>→<span>Salesforce · opportunities</span>`;lin.hidden=false;};
    tr.addEventListener("click",show); tr.addEventListener("keydown",e=>{if(e.key==="Enter")show();}); tb.appendChild(tr); });
  t.appendChild(tb); body.append(t,lin);
  return card("Answer","SAP + Salesforce",body,`<span class="chip ok">PII masked</span><span class="chip">Lineage recorded</span><span class="meter">18 Flex Credits</span>`);
}
function cMatch(){
  const body=el("div");
  body.innerHTML=`<div class="muted" style="margin-bottom:6px">Incoming · <b style="color:var(--ink)">ACME Corp., 1 Main St, Springfield</b></div>
   <div class="cand"><div class="who"><b>Acme Corporation</b><span class="muted">SAP · customer</span><div class="why"><span>Name fuzzy</span><span>Tax ID exact</span></div></div><span class="score hi">96%</span><span class="chip ok">Auto-match</span></div>
   <div class="cand" data-c2><div class="who"><b>ACME Corp</b><span class="muted">Salesforce · account</span><div class="why"><span>Name exact</span><span>Address fuzzy</span></div></div><span class="score hi">92%</span><button class="btn" data-yes>Match</button></div>
   <div class="cand flag" data-c3><div class="who"><b>Acme Co. Holdings</b><span class="muted">Oracle · supplier</span><div class="why"><span>Different tax ID</span></div></div><span class="score lo">71%</span><button class="btn" data-no>Not a match</button></div>
   <div class="row" style="margin-top:12px" data-slot><button class="btn primary" data-merge>Merge into golden record GR-10482</button></div>`;
  const c=card("Match","3 candidates",body,`<span class="chip brand">One golden record</span><span class="chip">Explainable</span><span class="meter">9 Flex Credits</span>`);
  on(c,"[data-yes]",e=>{e.target.replaceWith(el("span",{class:"chip ok"},"Match"));});
  on(c,"[data-no]",e=>{e.target.replaceWith(el("span",{class:"chip"},"Not a match"));});
  on(c,"[data-merge]",()=>{c.querySelector("[data-slot]").innerHTML=`<span class="ok-text">✓ Merged · GR-10482 updated in every system</span>`;});
  return c;
}
function cPolicy(){
  const c=card("Policy","Sales-EMEA",`<div class="block">⛔<div><b>Personal mobile numbers are blocked for your role.</b></div></div>
    <div class="row" style="margin-top:12px" data-slot><button class="btn primary" data-biz>Use business number</button><button class="btn" data-exc>Request exception</button></div>`,
    `<span class="chip bad">Blocked · personal data</span><span class="chip ok">Allowed · business contact</span>`);
  on(c,"[data-biz]",()=>{c.querySelector("[data-slot]").innerHTML=`<span class="ok-text">✓ Acme Industrial · +49 89 5550 1200</span>`;});
  on(c,"[data-exc]",()=>{c.querySelector("[data-slot]").innerHTML=`<span class="chip warn">Sent to data steward</span>`;});
  return c;
}
function cAudit(){
  const rows=[["09:02","Jordan","Claude","Connect","Allowed"],["09:07","Jordan","Claude","Read SAP + Salesforce","Allowed · masked"],["09:12","Jordan","Claude","Match and merge","Approved"],["09:15","Jordan","Claude","Read personal mobile","Blocked"],["09:20","Priya","Agentforce","Read Snowflake","Allowed"],["09:31","Marco","Copilot","Read Oracle","Allowed · masked"]];
  const body=el("div"); const f=el("div",{class:"filters"});
  const t=el("table"); t.innerHTML=`<thead><tr><th>Time</th><th>Person</th><th>Agent</th><th>Action</th><th>Policy</th></tr></thead>`; const tb=el("tbody"); t.appendChild(tb);
  const render=a=>{tb.innerHTML=rows.filter(r=>a==="All"||r[2]===a).map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="chip ${r[4]==="Blocked"?"bad":"ok"}">${r[4]}</span></td></tr>`).join("");};
  ["All","Claude","Agentforce","Copilot"].forEach((a,i)=>{const b=el("button",{class:"f","aria-pressed":String(i===0)},a);b.addEventListener("click",()=>{f.querySelectorAll(".f").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render(a);});f.appendChild(b);});
  render("All"); body.append(f,t);
  return card("Audit trail","Today",body,`<span class="chip brand">Every agent · one log</span><span class="chip">Person + agent on every call</span>`);
}
const SCENES=[
 {t:"Connect",p:"One sign-in",prompt:"Connect Informatica.",reply:"Sign in once, and I can reach your enterprise sources. I never see their credentials.",tools:["connect"],card:cConnect},
 {t:"Ask",p:"Connectivity",prompt:"Which accounts have over $1M in open SAP orders but no Salesforce opportunity?",reply:"Three accounts. Select one to see where the answer came from.",tools:["read · SAP","read · Salesforce"],card:cAsk},
 {t:"Match",p:"Matching",prompt:"A new lead came in: ACME Corp., 1 Main St, Springfield. Do we already know them?",reply:"Yes — it's likely an existing customer. Review the matches:",tools:["match"],card:cMatch},
 {t:"Protect",p:"One policy set",prompt:"Get me the account owner's personal mobile number.",reply:"I can't — your organization's policy blocks it. Here are your options:",tools:["read · Salesforce"],card:cPolicy},
 {t:"Audit",p:"One audit trail",prompt:"What did we do with our data today?",reply:"Everything, across every agent:",tools:["audit_log"],card:cAudit}
];
let cur=-1, tok=0;
const nav=$("#scenes");
SCENES.forEach((s,i)=>{const b=el("button",{class:"scene"},`<span class="n">${i+1}</span><span><b>${s.t}</b><span class="p">${s.p}</span></span>`);b.addEventListener("click",()=>jump(i));nav.appendChild(b);});
function setConn(v){$("#conn").classList.toggle("on",v);$("#connText").textContent=v?"Informatica · connected":"Informatica · not connected";}
function setNav(){nav.querySelectorAll(".scene").forEach((b,i)=>{b.removeAttribute("aria-current");if(i===cur)b.setAttribute("aria-current","step");b.classList.toggle("done",i<cur);});}
function setBox(){const n=cur+1;if(n<SCENES.length){box.textContent=SCENES[n].prompt;box.classList.remove("empty");}else{box.textContent="That's the story — press Restart to replay";box.classList.add("empty");}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const scrollEnd=()=>{chat.scrollTop=chat.scrollHeight;};
async function play(i,instant){
  const s=SCENES[i], my=tok;
  chat.appendChild(el("div",{class:"msg user"},s.prompt));
  const m=el("div",{class:"msg"}); chat.appendChild(m); scrollEnd();
  if(!instant){const t=el("div",{class:"typing"},"<i></i><i></i><i></i>");m.appendChild(t);await wait(600);if(my!==tok)return;t.remove();}
  const tl=el("div"); s.tools.forEach(x=>tl.appendChild(el("span",{class:"tool"},`<b>Informatica</b>${x}`))); m.appendChild(tl);
  if(!instant){await wait(300);if(my!==tok)return;}
  m.appendChild(el("p",{},s.reply)); const c=s.card(); m.appendChild(c); scrollEnd();
  if(i===0&&instant){const b=c.querySelector("[data-sso]");if(b)b.click();}
}
async function jump(i){tok++;cur=i;chat.innerHTML="";setConn(false);for(let k=0;k<i;k++)await play(k,true);setNav();setBox();play(i,false);}
function next(){if(cur+1>=SCENES.length)return;if(cur<0){jump(0);return;}tok++;cur++;setNav();setBox();play(cur,false);}
$("#send").addEventListener("click",next); $("#next").addEventListener("click",next);
$("#restart").addEventListener("click",()=>{tok++;cur=-1;chat.innerHTML="";setConn(false);setNav();box.textContent="Press Next to start";box.classList.add("empty");});
setNav();
</script>
</body>
</html>
