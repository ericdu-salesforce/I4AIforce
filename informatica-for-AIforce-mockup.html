<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informatica for AIforce · in Claude, ChatGPT, Slack and Teams</title>
<style>
:root{--page:#eef0f3;--ink:#17212c;--muted:#6c7888;--line:#dfe3e8;--brand:#0b6bcb;--panel:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0f141a;--ink:#e9edf2;--muted:#8f9bab;--line:#2a3440;--panel:#171d25}}
:root[data-theme="dark"]{--page:#0f141a;--ink:#e9edf2;--muted:#8f9bab;--line:#2a3440;--panel:#171d25}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.shell{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:16px}
.hosts{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:var(--page)}
.hosts button{all:unset;cursor:pointer;padding:5px 14px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.hosts button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hosts button:focus-visible,.pbtn:focus-visible,.scene:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top .act{margin-left:auto;display:flex;gap:8px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.pbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.scene{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:10px}
.scene .n{flex:0 0 24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.scene b{display:block;font-size:14px}.scene span.p{font-size:12px;color:var(--muted)}
.scene[aria-current="step"]{background:rgba(11,107,203,.1)}
.scene[aria-current="step"] .n{background:var(--brand);border-color:var(--brand);color:#fff}
.scene.done .n{border-color:#1f7a3f;color:#1f7a3f}
.navnote{margin:14px 8px 0;font-size:12px;color:var(--muted);line-height:1.5}
.stage{padding:14px;min-height:0;display:flex}
.frame{flex:1;min-height:0;border-radius:14px;overflow:hidden;display:flex;box-shadow:0 2px 6px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.08);border:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#999;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg{animation:rise .25s ease}
.side{flex:0 0 200px;padding:12px;overflow:hidden;font-size:13.5px}
.side .item{padding:6px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* CLAUDE */
.h-claude{background:#faf9f5;color:#141413}
.h-claude .side{background:#f5f4ed;border-right:1px solid #e8e6dc;color:#3d3d3a}
.h-claude .logo{display:flex;align-items:center;gap:8px;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:19px;margin:2px 4px 14px;color:#141413}
.h-claude .logo i{font-style:normal;color:#d97757;font-size:20px}
.h-claude .newchat{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-weight:500}
.h-claude .newchat span{width:22px;height:22px;border-radius:50%;background:#d97757;color:#fff;display:grid;place-items:center;font-size:15px}
.h-claude .side .lbl{font-size:12px;color:#83827d;margin:14px 8px 4px}
.h-claude .side .item.on{background:#e8e6dc}
.h-claude .ctop{padding:12px 20px;font-size:14px;color:#3d3d3a}
.h-claude .chat{padding:8px 0 16px;align-items:center}
.h-claude .col{width:100%;max-width:720px;padding:0 20px;display:flex;flex-direction:column;gap:14px}
.h-claude .u{align-self:flex-end;background:#f0eee6;border-radius:14px;padding:10px 14px;max-width:80%;font-size:15px}
.h-claude .a{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:16.5px;line-height:1.6;color:#141413}
.h-claude .tool{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#73726c;border:1px solid #e8e6dc;background:#fff;border-radius:10px;padding:6px 10px;align-self:flex-start}
.h-claude .tool b{color:#3d3d3a;font-weight:600}
.h-claude .mcpapp{border:1px solid #e3e1d8;border-radius:14px;background:#fff;max-height:500px;overflow:auto}
.h-claude .composer{padding:0 20px 16px;display:flex;justify-content:center}
.h-claude .cbox{width:100%;max-width:720px;background:#fff;border:1px solid #e3e1d8;border-radius:20px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.h-claude .cbox .ph{min-height:24px;font-size:15px}.h-claude .cbox .ph.empty{color:#a3a29c}
.h-claude .cbar{display:flex;align-items:center;gap:10px;margin-top:8px;color:#73726c;font-size:13px}
.h-claude .cbar .plus{width:28px;height:28px;border:1px solid #e3e1d8;border-radius:8px;display:grid;place-items:center}
.h-claude .cbar .model{margin-left:auto}
.h-claude .send{width:32px;height:32px;border-radius:8px;border:0;background:#c96442;color:#fff;cursor:pointer;font-size:16px}
/* CHATGPT */
.h-chatgpt{background:#fff;color:#0d0d0d}
.h-chatgpt .side{background:#f9f9f9;border-right:1px solid #ececec;color:#0d0d0d}
.h-chatgpt .side .brand{font-weight:600;margin:4px 8px 12px;font-size:15px}
.h-chatgpt .side .item.on{background:#ececec}
.h-chatgpt .side .lbl{font-size:12px;color:#8f8f8f;margin:14px 8px 4px}
.h-chatgpt .gtop{padding:12px 18px;font-size:17px;font-weight:500;display:flex;align-items:center;gap:6px}
.h-chatgpt .gtop .share{margin-left:auto;font-size:13px;border:1px solid #e5e5e5;border-radius:999px;padding:4px 12px}
.h-chatgpt .chat{padding:8px 0 16px;align-items:center}
.h-chatgpt .col{width:100%;max-width:740px;padding:0 20px;display:flex;flex-direction:column;gap:14px}
.h-chatgpt .u{align-self:flex-end;background:#f4f4f4;border-radius:18px;padding:10px 16px;max-width:75%;font-size:15.5px}
.h-chatgpt .a{font-size:16px;line-height:1.65}
.h-chatgpt .appname{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#5d5d5d}
.h-chatgpt .appname .ic{width:20px;height:20px;border-radius:6px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-size:11px}
.h-chatgpt .inline{border:1px solid #e5e5e5;border-radius:22px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);overflow:hidden}
.h-chatgpt .composer{padding:0 20px 16px;display:flex;justify-content:center}
.h-chatgpt .gpill{width:100%;max-width:740px;display:flex;align-items:center;gap:12px;border:1px solid #e5e5e5;border-radius:28px;padding:10px 12px 10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.h-chatgpt .gpill .ph{flex:1;font-size:15.5px}.h-chatgpt .gpill .ph.empty{color:#8f8f8f}
.h-chatgpt .gpill .ico{color:#5d5d5d;font-size:18px}
.h-chatgpt .send{width:36px;height:36px;border-radius:50%;border:0;background:#0d0d0d;color:#fff;cursor:pointer;font-size:16px}
/* rich MCP App content */
.app-h{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.app-h .ic{width:22px;height:22px;border-radius:6px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.app-h b{font-size:15px}.app-h small{display:block;font-size:12.5px;color:#737373;font-weight:400}
.app-h .fs{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid #e5e5e5;display:grid;place-items:center;color:#737373;font-size:13px}
.app-b{padding:8px 16px 14px;font-size:14px;color:#1f1f1f}
.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt th{text-align:left;font-size:12px;color:#8a8a8a;font-weight:600;padding:6px 8px;border-bottom:1px solid #eee}
.rt td{padding:8px;border-bottom:1px solid #f1f1f1}
.chip{display:inline-flex;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:#e6f4eb;color:#1f7a3f}.chip.warn{background:#fdf1dc;color:#9a5b00}.chip.bad{background:#fdeceb;color:#b42318}.chip.muted{background:#f1f1f1;color:#6b6b6b}.chip.plain{background:#f1f1f1;color:#333}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.facts div{border:1px solid #eee;border-radius:10px;padding:8px 10px}
.facts span{display:block;font-size:11.5px;color:#8a8a8a}
.callout{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6f8fb;font-size:13.5px}
.callout.bad{background:#fdeceb;color:#7a1a12}.callout.warn{background:#fdf6ea;color:#5a3d0b}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#8a8a8a;margin-bottom:10px}
.flow span{border:1px solid #eee;border-radius:8px;padding:4px 9px;background:#fafafa;color:#1f1f1f}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;overflow-x:auto;background:#f7f7f7;border:1px solid #eee;border-radius:10px;padding:10px 12px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.abtn{border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#1f1f1f}
.abtn.pri{background:#0b6bcb;border-color:#0b6bcb;color:#fff}
.h-claude .abtn{border-radius:8px}
.done{margin-top:12px;font-weight:600;color:#1f7a3f;font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-top:1px solid #f1f1f1;font-size:12px;color:#8a8a8a}
/* SLACK */
.h-slack{background:#fff;color:#1d1c1d;font-family:Lato,"Helvetica Neue",Helvetica,Arial,sans-serif}
.h-slack .rail{flex:0 0 60px;background:#3f0e40;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px}
.h-slack .rail .ws{width:36px;height:36px;border-radius:9px;background:#fff;color:#3f0e40;display:grid;place-items:center;font-weight:900}
.h-slack .rail .ri{width:44px;text-align:center;color:#e8d5e8;font-size:11px}
.h-slack .side{background:#4a154b;color:#e8d5e8;flex-basis:210px}
.h-slack .side .wsname{color:#fff;font-weight:900;font-size:16px;margin:2px 6px 14px}
.h-slack .side .lbl{font-size:13px;color:#cdb5cd;margin:12px 6px 4px}
.h-slack .side .item.on{background:#1164a3;color:#fff;font-weight:700}
.h-slack .stop{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #e8e8e8}
.h-slack .stop .av{width:26px;height:26px;border-radius:6px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}
.h-slack .stop b{font-size:16px;font-weight:900}
.h-slack .stop .tag{font-size:11px;font-weight:700;background:#e8e8e8;color:#616061;border-radius:4px;padding:1px 5px}
.h-slack .stop .new{margin-left:auto;font-size:13px;border:1px solid #ddd;border-radius:6px;padding:3px 10px}
.h-slack .chat{padding:14px 18px;gap:6px}
.h-slack .sm{display:flex;gap:10px;padding:6px 0}
.h-slack .sm .av{flex:0 0 36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px}
.h-slack .sm .av.me{background:#e2c4a8;color:#5c3b1e}.h-slack .sm .av.bot{background:#0b6bcb;color:#fff}
.h-slack .sm .body{flex:1;min-width:0}
.h-slack .sm .who{font-weight:900;font-size:15px}
.h-slack .sm .who .apptag{font-size:10.5px;font-weight:700;background:#e8e8e8;color:#616061;border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}
.h-slack .sm .who .t{font-weight:400;font-size:12px;color:#616061;margin-left:6px}
.h-slack .sm .txt{font-size:15px}
.bk-plan{border:1px solid #e0e0e0;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13.5px;max-width:560px}
.bk-plan .pt{font-weight:700;font-size:13px;color:#616061;margin-bottom:4px}
.bk-plan .task{display:flex;gap:8px;align-items:center;padding:2px 0}
.bk-plan .task .ok{color:#007a5a;font-weight:900}
.bk-card{border:1px solid #e0e0e0;border-radius:8px;padding:12px 14px;margin:8px 0;max-width:620px}
.bk-card .ch{display:flex;gap:10px;align-items:center}
.bk-card .ch .ic{width:28px;height:28px;border-radius:6px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.bk-card .ch b{font-size:15px}.bk-card .ch small{display:block;font-size:13px;color:#616061}
.bk-card .cb{margin-top:8px;font-size:14.5px}.bk-card .cb div{margin:2px 0}
.bk-table{border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;margin:8px 0;max-width:620px}
.bk-table table{width:100%;border-collapse:collapse;font-size:14px}
.bk-table th{background:#f8f8f8;text-align:left;font-weight:700;padding:6px 10px;border-bottom:1px solid #e0e0e0}
.bk-table td{padding:6px 10px;border-bottom:1px solid #eee}
.bk-table tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.ok{background:#2bac76}.dot.warn{background:#ecb22e}.dot.bad{background:#e01e5a}.dot.muted,.dot.plain{background:#bbb}
.bk-alert{display:flex;gap:10px;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14.5px;max-width:620px;background:#fdf6e3;border:1px solid #f2d78b}
.bk-alert.bad{background:#fdecef;border-color:#f3b4c4}.bk-alert.info{background:#eef6fd;border-color:#bcd9f2}
.bk-code{font-family:Monaco,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;overflow-x:auto;background:#f8f8f8;border:1px solid #e0e0e0;border-radius:6px;padding:10px 12px;margin:8px 0;max-width:620px}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sbtn{border:1px solid #c7c7c7;background:#fff;border-radius:6px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.sbtn.pri{background:#007a5a;border-color:#007a5a;color:#fff}
.bk-ctx{font-size:12.5px;color:#616061;margin-top:4px}
.bk-fb{display:flex;gap:6px;margin-top:6px}
.bk-fb span{border:1px solid #e0e0e0;border-radius:6px;padding:1px 8px;font-size:13px}
.h-slack .composer{padding:0 18px 16px}
.h-slack .sbox{border:1px solid #bbbabb;border-radius:8px}
.h-slack .sbox .tb{display:flex;gap:14px;padding:6px 10px;background:#f8f8f8;border-bottom:1px solid #e8e8e8;color:#616061;font-size:13px;border-radius:8px 8px 0 0}
.h-slack .sbox .row{display:flex;align-items:center;padding:8px 10px}
.h-slack .sbox .ph{flex:1;font-size:15px}.h-slack .sbox .ph.empty{color:#868686}
.h-slack .send{border:0;background:#007a5a;color:#fff;border-radius:4px;width:32px;height:28px;cursor:pointer}
/* TEAMS */
.h-teams{background:#f5f5f5;color:#242424;font-family:"Segoe UI","Segoe UI Web",system-ui,sans-serif}
.h-teams .rail{flex:0 0 68px;background:#ebebeb;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px;font-size:10.5px;color:#616161}
.h-teams .rail .ri{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;width:60px;border-radius:6px}
.h-teams .rail .ri i{font-style:normal;font-size:17px}
.h-teams .rail .ri.on{color:#5b5fc7;background:#fff}
.h-teams .side{background:#fafafa;border-right:1px solid #e0e0e0;flex-basis:230px}
.h-teams .side .lbl{font-weight:700;font-size:15px;margin:2px 6px 10px}
.h-teams .side .item{display:flex;gap:8px;align-items:center;padding:8px}
.h-teams .side .item .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 28px}
.h-teams .side .item.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.h-teams .ttop{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid #e0e0e0}
.h-teams .ttop .av{width:32px;height:32px;border-radius:50%;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.h-teams .ttop b{font-size:16px}
.h-teams .ttop .tab{margin-left:12px;font-size:14px;border-bottom:2px solid #5b5fc7;padding:4px 2px;font-weight:600}
.h-teams .chat{padding:16px 20px;gap:14px}
.h-teams .tu{align-self:flex-end;background:#e8ebfa;border-radius:6px;padding:8px 12px;max-width:70%;font-size:14.5px}
.h-teams .tm{display:flex;gap:10px;max-width:760px}
.h-teams .tm .av{flex:0 0 32px;height:32px;border-radius:50%;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.h-teams .tm .bubble{background:#fff;border-radius:6px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08);min-width:0;flex:1}
.h-teams .tm .who{font-size:12.5px;color:#616161;margin-bottom:2px}
.h-teams .tm .who b{color:#242424;margin-right:6px}
.h-teams .ailabel{display:inline-block;font-size:11px;border:1px solid #d1d1d1;border-radius:4px;padding:0 5px;margin-left:6px;color:#616161}
.h-teams .upd{font-size:13.5px;color:#616161;font-style:italic}
.cite{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:4px;background:#e8ebfa;color:#4f52b2;font-size:11px;font-weight:700;margin-left:3px;vertical-align:2px;padding:0 3px}
.refs{margin-top:8px;font-size:12.5px;color:#616161;border-top:1px solid #f0f0f0;padding-top:6px}
.refs b{color:#242424}
.ac{border:1px solid #e0e0e0;border-radius:8px;padding:12px 14px;margin-top:8px;background:#fff}
.ac .ttl{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.ac .ttl .ic{width:20px;height:20px;border-radius:4px;background:#0b6bcb;color:#fff;display:grid;place-items:center;font-size:11px}
.ac .subtle{font-size:13px;color:#616161;margin-top:2px}
.ac .factset{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.ac .factset dt{font-weight:600}.ac .factset dd{margin:0}
.ac table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.ac th{text-align:left;font-weight:600;padding:6px 8px;border:1px solid #e0e0e0;background:#fafafa}
.ac td{padding:6px 8px;border:1px solid #e0e0e0}
.good{color:#237b4b;font-weight:600}.warning{color:#835c00;font-weight:600}.attention{color:#c4314b;font-weight:600}.subtle2{color:#616161}
.ac .cont{margin-top:10px;padding:8px 10px;border-radius:4px;font-size:13.5px;background:#f5f5f5}
.ac .cont.warning2{background:#fff4ce}.ac .cont.attention2{background:#fde7e9}
.ac .codeblk{font-family:Consolas,Menlo,monospace;font-size:12.5px;white-space:pre;overflow-x:auto;background:#f5f5f5;border-radius:4px;padding:8px 10px;margin-top:10px}
.ac .actset{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tbtn{border:1px solid #d1d1d1;background:#fff;border-radius:4px;padding:5px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tbtn.pri{background:#5b5fc7;border-color:#5b5fc7;color:#fff}
.h-teams .suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 8px}
.h-teams .suggest span{border:1px solid #d1d1d1;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-teams .composer{padding:0 20px 14px}
.h-teams .tbox{background:#fff;border-radius:6px;border-bottom:2px solid #5b5fc7;display:flex;align-items:center;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.h-teams .tbox .ph{flex:1;font-size:14.5px}.h-teams .tbox .ph.empty{color:#707070}
.h-teams .send{border:0;background:transparent;color:#5b5fc7;font-size:18px;cursor:pointer}
@media (max-width:1100px){.side{display:none}}
@media (max-width:820px){.shell{display:block;height:auto}.nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.scene{width:auto;flex:0 0 auto}.navnote{display:none}.stage{height:82vh}.rail{display:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Informatica for AIforce</h1>
    <div class="hosts" role="group" aria-label="Choose the agent experience">
      <button data-h="claude" aria-pressed="true">Claude</button><button data-h="chatgpt" aria-pressed="false">ChatGPT</button><button data-h="slack" aria-pressed="false">Slack</button><button data-h="teams" aria-pressed="false">Teams</button>
    </div>
    <div class="act"><button class="pbtn" id="restart">Restart</button><button class="pbtn pri" id="next">Next →</button></div>
  </header>
  <nav class="nav" aria-label="Scenes"><div id="scenes"></div><p class="navnote">One Informatica MCP server. Rendered as an MCP App in Claude and ChatGPT, Block Kit in Slack, and an Adaptive Card in Teams.</p></nav>
  <main class="stage"><div class="frame" id="frame"></div></main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const HOSTNAME={claude:"Claude",chatgpt:"ChatGPT",slack:"Slack",teams:"Teams"};
const S=[
 {t:"Connect",p:"One sign-in",tool:"connect.list_sources",prompt:"Connect Informatica.",reply:"You're connected through Informatica. I can reach these sources, and I never see their credentials.",
  title:"Connected sources",sub:"Signed in as Jordan Lee · company SSO",
  table:{cols:["Source","Mode","Status"],rows:[["SAP S/4HANA","CDC","ok:Connected"],["Salesforce","Real time","ok:Connected"],["Snowflake","Batch","ok:Connected"],["Oracle EBS","Batch","ok:Connected"],["Mainframe Db2","Replica","ok:Connected"],["Workday","—","warn:Restricted"]]},
  note:["warn","Workday is restricted for your role."],acts:["Test all connections","Request Workday access"],done:"✓ 5 of 5 connections healthy · tested just now",foot:"Credentials held by Informatica",cite:"Informatica · connection service"},
 {t:"Understand",p:"Metadata lakehouse",tool:"understand.search_catalog",prompt:"Where does our customer data live, and what's sensitive?",reply:"Customer data lives in four systems. Here's what Informatica knows about it.",
  title:"Customer data",sub:"4 certified assets · metadata lakehouse",
  table:{cols:["Dataset","System","Quality","Sensitive"],rows:[["DIM_CUSTOMER","Snowflake","96","warn:Email"],["Account","Salesforce","93","warn:Email, phone"],["KNA1 customers","SAP S/4HANA","91","warn:Tax ID"],["HZ_PARTIES","Oracle EBS","88","warn:Address"]]},
  facts:[["Certified definition","Active customer = ordered in the last 12 months"]],acts:["Show lineage","Open in catalog"],done:"Lineage: SAP KNA1 → golden customer → Snowflake DIM_CUSTOMER → 3 dashboards",foot:"Filtered to what you're allowed to see",cite:"Informatica · data catalog"},
 {t:"Transform",p:"Build a pipeline",tool:"transform.author_mapping",prompt:"Build a daily pipeline that brings open SAP orders into Snowflake, joined to our customers.",reply:"Here's the pipeline. It runs on your Snowflake, and the tests pass.",
  title:"Pipeline · OPEN_ORDERS_DAILY",sub:"SAP → Snowflake · runs on Snowflake",
  flow:["SAP · open orders (CDC)","Join to golden customer","Snowflake · OPEN_ORDERS"],
  code:"select o.order_id, c.golden_id, o.open_value\nfrom sap.vbak o\njoin golden_customer c on c.sap_id = o.kunnr\nwhere o.status = 'OPEN';",
  facts:[["Tests","3 passed"],["Schedule","Daily at 06:00"]],acts:["Deploy","Edit"],done:"✓ Deployed · first run tomorrow at 06:00",foot:"Reviewed before deploy · reversible",cite:"Informatica · data integration"},
 {t:"Deliver",p:"Data product",tool:"deliver.publish_data_product",prompt:"Publish it as a data product for the sales team.",reply:"It's ready to publish, with a contract, everywhere the sales team works.",
  title:"Data product · Open orders by account",sub:"v1.0 · owner Sales Ops",
  facts:[["Freshness","Daily by 06:00"],["Quality","98%"],["Access","Sales · PII masked"]],
  table:{cols:["Destination","Status"],rows:[["Snowflake","plain:Ready"],["Data 360","plain:Ready"],["Semantic layer","plain:Ready"],["OKF knowledge doc","plain:Ready"]]},
  acts:["Publish v1.0","Preview contract"],done:"✓ Published to 4 destinations · subscribers notified",after:"publish",foot:"Contract (ODCS) · lineage to source",cite:"Informatica · data products"},
 {t:"Trust · match",p:"Matching",tool:"trust.match",prompt:"A new lead came in: ACME Corp., 1 Main St, Springfield. Do we already know them?",reply:"Yes — it's an existing customer. Here are the matches.",
  title:"Match · ACME Corp.",sub:"3 candidates · SSA-NAME3 and a decision model",
  table:{cols:["Candidate","Source","Score","Decision"],rows:[["Acme Corporation","SAP · EN-10482","96","ok:Match"],["ACME Corp","Salesforce · EN-10482","92","ok:Match"],["Acme Co. Holdings","Oracle · EN-20931","78","muted:Not a match"]]},
  note:["info","Acme Co. Holdings has a different tax ID — the decision model ruled it out (confidence 0.93)."],acts:["Link lead to EN-10482","Create new anyway"],done:"✓ Lead linked to Acme Corporation (EN-10482) · routed to owner Dana K.",foot:"Explainable · reversible",cite:"Informatica · matching service"},
 {t:"Trust · protect",p:"Policy",tool:"trust.check_policy",prompt:"Get me the account owner's personal mobile number.",reply:"I can't share that — your organization's policy blocks it. Here's what I can do instead.",
  title:"Policy decision",sub:"Rule PII.Contact · Sales Ops · EMEA",
  note:["bad","Personal mobile numbers are blocked for your role."],facts:[["Business phone","+49 89 5550 1200"],["Business email","d•••@acme.com"]],acts:["Use business contact","Request exception"],done:"✓ Business contact added to the opportunity",foot:"Decision logged",cite:"Informatica · policy service"},
 {t:"Close the loop",p:"Audit and learn",tool:"trust.audit_log",prompt:"What did we do today, and what did Informatica learn?",reply:"Everything is in one audit trail, across every agent — and your decisions now improve the context for everyone.",
  title:"Audit trail · today",sub:"One log across Claude, ChatGPT, Slack and Teams",
  table:{cols:["Time","Person · agent","Action","Policy"],rows:[["09:02","Jordan · {HOST}","Connect","ok:Allowed"],["09:12","Jordan · {HOST}","Deploy pipeline","ok:Approved"],["09:15","Jordan · {HOST}","Link lead","ok:Approved"],["09:17","Jordan · {HOST}","Read personal mobile","bad:Blocked"],["09:20","Priya · Agentforce","Read data product","ok:Allowed"],["09:31","Marco · Copilot","Read Oracle","ok:Masked"]]},
  note:["info","Learned today: ACME Corp. is Acme Corporation (confirmed by Jordan). Open orders by account was used by 3 agents."],acts:["Export for audit","Filter by agent"],done:"✓ Exported audit-2026-09-30.csv",foot:"Every agent · one log",cite:"Informatica · audit service"}
];
let host="claude", cur=-1, tok=0; const DONE={};
function view(i){const s=JSON.parse(JSON.stringify(S[i]));
  if(DONE[i]&&s.after==="publish") s.table.rows.forEach(r=>r[1]="ok:Published");
  if(s.table) s.table.rows=s.table.rows.map(r=>r.map(c=>String(c).replace("{HOST}",HOSTNAME[host])));
  return s;}
const tk=c=>{const m=String(c).match(/^(ok|warn|bad|muted|plain):(.*)$/);return m?{k:m[1],v:m[2]}:null;};
function richBody(s,i){
  let h="";
  if(s.flow) h+=`<div class="flow">${s.flow.map(x=>`<span>${x}</span>`).join("→")}</div>`;
  if(s.code) h+=`<div class="code">${s.code}</div>`;
  if(s.note&&s.note[0]==="bad") h+=`<div class="callout bad" style="margin-top:0">${s.note[1]}</div>`;
  if(s.table) h+=`<table class="rt"><thead><tr>${s.table.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map((c,k)=>{const t=tk(c);return `<td>${t?`<span class="chip ${t.k}">${t.v}</span>`:(k===0?`<b>${c}</b>`:c)}</td>`}).join("")}</tr>`).join("")}</tbody></table>`;
  if(s.facts) h+=`<div class="facts">${s.facts.map(([a,b])=>`<div><span>${a}</span>${b}</div>`).join("")}</div>`;
  if(s.note&&s.note[0]!=="bad") h+=`<div class="callout ${s.note[0]==="warn"?"warn":""}">${s.note[1]}</div>`;
  h+= DONE[i]?`<div class="done">${s.done}</div>`:`<div class="acts"><button class="abtn pri" data-do>${s.acts[0]}</button><button class="abtn">${s.acts[1]}</button></div>`;
  return h;
}
const richApp=(s,i,cls)=>`<div class="${cls}" data-card="${i}"><div class="app-h"><span class="ic">i</span><div><b>${s.title}</b><small>${s.sub}</small></div><span class="fs" title="Open fullscreen" aria-label="Open fullscreen">⤢</span></div><div class="app-b">${richBody(s,i)}</div><div class="foot">${s.foot}</div></div>`;
function blockKit(s,i){
  let h=`<div class="bk-card"><div class="ch"><span class="ic">i</span><div><b>${s.title}</b><small>${s.sub}</small></div></div>${s.facts?`<div class="cb">${s.facts.map(([a,b])=>`<div><b>${a}:</b> ${b}</div>`).join("")}</div>`:""}</div>`;
  if(s.flow) h+=`<div class="bk-ctx" style="font-size:14px;color:#1d1c1d">${s.flow.join("  →  ")}</div>`;
  if(s.code) h+=`<div class="bk-code">${s.code}</div>`;
  if(s.table) h+=`<div class="bk-table"><table><thead><tr>${s.table.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>{const t=tk(c);return `<td>${t?`<span class="dot ${t.k}"></span>${t.v}`:c}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(s.note) h+=`<div class="bk-alert ${s.note[0]==="bad"?"bad":s.note[0]==="info"?"info":""}"><span>${s.note[0]==="bad"?"⛔":s.note[0]==="info"?"ℹ️":"⚠️"}</span><span>${s.note[1]}</span></div>`;
  h+= DONE[i]?`<div class="bk-ctx" style="font-size:14.5px;color:#007a5a;font-weight:700">${s.done}</div>`:`<div class="bk-actions"><button class="sbtn pri" data-do>${s.acts[0]}</button><button class="sbtn">${s.acts[1]}</button></div>`;
  h+=`<div class="bk-ctx">Informatica · ${s.foot}</div><div class="bk-fb"><span>👍</span><span>👎</span></div>`;
  return `<div data-card="${i}">${h}</div>`;
}
const AC={ok:"good",warn:"warning",bad:"attention",muted:"subtle2",plain:"subtle2"};
function adaptive(s,i){
  let h=`<div class="ttl"><span class="ic">i</span>${s.title}</div><div class="subtle">${s.sub}</div>`;
  if(s.facts) h+=`<dl class="factset">${s.facts.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`;
  if(s.flow) h+=`<div class="cont">${s.flow.join("  →  ")}</div>`;
  if(s.code) h+=`<div class="codeblk">${s.code}</div>`;
  if(s.table) h+=`<table><thead><tr>${s.table.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>{const t=tk(c);return `<td>${t?`<span class="${AC[t.k]}">${t.v}</span>`:c}</td>`}).join("")}</tr>`).join("")}</tbody></table>`;
  if(s.note) h+=`<div class="cont ${s.note[0]==="bad"?"attention2":s.note[0]==="warn"?"warning2":""}">${s.note[1]}</div>`;
  h+= DONE[i]?`<div class="cont" style="background:#e7f2da"><span class="good">${s.done}</span></div>`:`<div class="actset"><button class="tbtn pri" data-do>${s.acts[0]}</button><button class="tbtn">${s.acts[1]}</button></div>`;
  return `<div class="ac" data-card="${i}">${h}</div>`;
}
const FRAMES={
 claude:()=>`<div class="frame h-claude" id="frame"><aside class="side"><div class="logo"><i>✺</i>Claude</div><div class="newchat"><span>+</span>New chat</div><div class="lbl">Recents</div><div class="item on">Informatica for AIforce</div><div class="item">Q4 pipeline review</div><div class="item">Board revenue deck</div></aside>
   <div class="main"><div class="ctop">Informatica for AIforce ▾</div><div class="chat" id="chat"><div class="col" id="col"></div></div>
   <div class="composer"><div class="cbox"><div class="ph empty" id="box"></div><div class="cbar"><span class="plus">+</span><span>🔌 Informatica</span><span class="model">Opus 5.5 ▾</span><button class="send" id="send" aria-label="Send">↑</button></div></div></div></div></div>`,
 chatgpt:()=>`<div class="frame h-chatgpt" id="frame"><aside class="side"><div class="brand">ChatGPT</div><div class="item">✎ New chat</div><div class="item">⌕ Search chats</div><div class="lbl">Apps</div><div class="item on">Informatica</div><div class="lbl">Chats</div><div class="item">Informatica for AIforce</div><div class="item">Q4 pipeline review</div></aside>
   <div class="main"><div class="gtop">ChatGPT ▾<span class="share">Share</span></div><div class="chat" id="chat"><div class="col" id="col"></div></div>
   <div class="composer"><div class="gpill"><span class="ico">+</span><span class="ph empty" id="box"></span><span class="ico">🎙</span><button class="send" id="send" aria-label="Send">↑</button></div></div></div></div>`,
 slack:()=>`<div class="frame h-slack" id="frame"><div class="rail"><span class="ws">A</span><span class="ri">Home</span><span class="ri">DMs</span><span class="ri">Activity</span></div>
   <aside class="side"><div class="wsname">Acme Corp ▾</div><div class="lbl">Channels</div><div class="item"># general</div><div class="item"># sales-ops</div><div class="item"># data-team</div><div class="lbl">Apps</div><div class="item on">Informatica</div></aside>
   <div class="main"><div class="stop"><span class="av">i</span><b>Informatica</b><span class="tag">AI APP</span><span class="new">New chat</span></div><div class="chat" id="chat"></div>
   <div class="composer"><div class="sbox"><div class="tb"><b>B</b><i>I</i><s>S</s><span>🔗</span><span>≡</span><span>{ }</span></div><div class="row"><span class="ph empty" id="box"></span><button class="send" id="send" aria-label="Send">➤</button></div></div></div></div></div>`,
 teams:()=>`<div class="frame h-teams" id="frame"><div class="rail"><div class="ri"><i>🔔</i>Activity</div><div class="ri on"><i>💬</i>Chat</div><div class="ri"><i>👥</i>Teams</div><div class="ri"><i>📅</i>Calendar</div><div class="ri"><i>⊞</i>Apps</div></div>
   <aside class="side"><div class="lbl">Chat</div><div class="item on"><span class="av" style="background:#0b6bcb;color:#fff">i</span>Informatica</div><div class="item"><span class="av" style="background:#f2d6c2">PS</span>Priya Shah</div><div class="item"><span class="av" style="background:#d6e4f2">DT</span>Data team</div></aside>
   <div class="main"><div class="ttop"><span class="av">i</span><b>Informatica</b><span class="tab">Chat</span></div><div class="chat" id="chat"></div><div class="suggest" id="suggest"></div>
   <div class="composer"><div class="tbox"><span class="ph empty" id="box"></span><button class="send" id="send" aria-label="Send">➤</button></div></div></div></div>`
};
const PH={claude:"Reply to Claude…",chatgpt:"Ask anything",slack:"Message Informatica",teams:"Type a message"};
function userMsg(text,i){
  if(host==="claude"||host==="chatgpt") return el("div","u msg",text);
  if(host==="slack") return el("div","sm msg",`<span class="av me">JL</span><div class="body"><div class="who">Jordan Lee<span class="t">9:${10+i*2} AM</span></div><div class="txt">${text}</div></div>`);
  return el("div","tu msg",text);
}
function wire(scope,i){scope.querySelectorAll("[data-do]").forEach(b=>b.addEventListener("click",()=>{DONE[i]=true;rerenderCard(i);}));}
function agentMsg(i){
  const s=view(i), w=el("div","msg");
  if(host==="claude"){w.style.cssText="display:flex;flex-direction:column;gap:10px";
    w.innerHTML=`<span class="tool">⚙ <b>Informatica</b> ${s.tool} <span style="color:#a3a29c">▸</span></span>${richApp(s,i,"mcpapp")}<div class="a">${s.reply}</div>`;}
  else if(host==="chatgpt"){w.style.cssText="display:flex;flex-direction:column;gap:8px";
    w.innerHTML=`<span class="appname"><span class="ic">i</span>Informatica</span>${richApp(s,i,"inline")}<div class="a">${s.reply}</div>`;}
  else if(host==="slack"){w.className="sm msg";
    w.innerHTML=`<span class="av bot">i</span><div class="body"><div class="who">Informatica<span class="apptag">APP</span><span class="t">9:${11+i*2} AM</span></div>
      <div class="bk-plan"><div class="pt">Plan · 2 steps</div><div class="task"><span class="ok">✓</span>Called <span class="mono" style="font-size:12.5px">${s.tool}</span></div><div class="task"><span class="ok">✓</span>Applied your permissions and policy</div></div>
      <div class="txt">${s.reply}</div>${blockKit(s,i)}</div>`;}
  else{w.className="tm msg";
    w.innerHTML=`<span class="av">i</span><div class="bubble"><div class="who"><b>Informatica</b>9:${11+i*2} AM<span class="ailabel">AI generated</span></div><div class="txt">${s.reply}<span class="cite">1</span></div>${adaptive(s,i)}<div class="refs"><b>References</b> · <span class="cite">1</span> ${s.cite}</div></div>`;}
  wire(w,i); return w;
}
function rerenderCard(i){
  const old=document.querySelector(`[data-card="${i}"]`); if(!old) return;
  const s=view(i), tmp=el("div");
  tmp.innerHTML= host==="claude"?richApp(s,i,"mcpapp"):host==="chatgpt"?richApp(s,i,"inline"):host==="slack"?blockKit(s,i):adaptive(s,i);
  const fresh=tmp.firstElementChild; old.replaceWith(fresh); wire(fresh,i);
}
const target=()=>host==="claude"||host==="chatgpt"?$("#col"):$("#chat");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const scrollEnd=()=>{const c=$("#chat");if(c)c.scrollTop=c.scrollHeight;};
async function play(i,instant){
  const my=tok, t=target();
  t.appendChild(userMsg(S[i].prompt,i)); scrollEnd();
  if(!instant){
    const pending= host==="teams"?el("div","tm msg",`<span class="av">i</span><div class="bubble"><div class="who"><b>Informatica</b><span class="ailabel">AI generated</span></div><div class="upd">Checking with Informatica…</div></div>`)
      : host==="slack"?el("div","sm msg",`<span class="av bot">i</span><div class="body"><div class="who">Informatica<span class="apptag">APP</span></div><div class="txt" style="color:#616061;font-style:italic">is thinking…</div></div>`)
      : el("div","msg",`<div class="typing"><i></i><i></i><i></i></div>`);
    t.appendChild(pending); scrollEnd(); await wait(650); if(my!==tok) return; pending.remove();
  }
  t.appendChild(agentMsg(i)); scrollEnd();
}
function setBox(){
  const box=$("#box"), n=cur+1;
  if(n<S.length){box.textContent=S[n].prompt;box.classList.remove("empty");}
  else{box.textContent="That's the story — press Restart to replay";box.classList.add("empty");}
  const sg=$("#suggest"); if(sg){sg.innerHTML=n<S.length?`<span>${S[n].prompt}</span>`:"";const sp=sg.querySelector("span");if(sp)sp.onclick=next;}
}
function setNav(){document.querySelectorAll(".scene").forEach((b,i)=>{b.removeAttribute("aria-current");if(i===cur)b.setAttribute("aria-current","step");b.classList.toggle("done",i<cur);});}
function mount(){$("#frame").outerHTML=FRAMES[host]();$("#send").onclick=next;}
async function rebuild(){tok++;mount();for(let k=0;k<=cur;k++)await play(k,true);setNav();setBox();}
async function jump(i){tok++;cur=i;mount();for(let k=0;k<i;k++)await play(k,true);setNav();setBox();play(i,false);}
function next(){if(cur+1>=S.length)return;tok++;cur++;setNav();setBox();play(cur,false);}
const nav=$("#scenes");
S.forEach((s,i)=>{const b=el("button","scene",`<span class="n">${i+1}</span><span><b>${s.t}</b><span class="p">${s.p}</span></span>`);b.onclick=()=>jump(i);nav.appendChild(b);});
document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{host=b.dataset.h;document.querySelectorAll("[data-h]").forEach(x=>x.setAttribute("aria-pressed",x===b));rebuild();});
$("#next").onclick=next;
$("#restart").onclick=()=>{cur=-1;for(const k in DONE)delete DONE[k];rebuild();};
rebuild();
</script>
</body>
</html>
